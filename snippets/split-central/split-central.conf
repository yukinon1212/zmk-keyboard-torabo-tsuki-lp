CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --- 左右間リンクの安定化 (2026-07-29) ---
# セントラル側だけで有効な設定（ZMK v0.3: ZMK_SPLIT_ROLE_CENTRAL の中で定義）。
# supervision timeout を 400 (4秒) -> 800 (8秒) に延長する。
# 一瞬の電波干渉でリンクが切れてしまうのを防ぐのが目的。ペリフェラルは
# 一度切れると自力で復帰できないことがあるため、まず「切らさない」方向に振る。
# 消費電力には影響しない（接続間隔と latency は既定のまま）。
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=800
